version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=laptrinhweb

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laptrinhweb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./laptrinhweb.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
